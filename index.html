<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM Store Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h1>DOM Store Management</h1>

    <form id="add-form" novalidate>
      <label for="name">Item Name</label>
      <input id="name" type="text" placeholder="e.g. Studio Rent">
      <div class="error" id="name-error"></div>

      <label for="price">Price ($)</label>
      <input id="price" type="text" inputmode="decimal" placeholder="e.g. 50">
      <div class="error" id="price-error"></div>

      <label for="qty">Quantity</label>
      <input id="qty" type="text" inputmode="numeric" placeholder="e.g. 2">
      <div class="error" id="qty-error"></div>

      <button type="submit" class="btn btn-add">Add Item</button>
    </form>

    <table>
      <thead>
        <tr><th>Name</th><th>Price ($)</th><th>Quantity</th><th>Total ($)</th><th>Actions</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>

    <div class="total" id="total">Total Amount: $0.00</div>
  </div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
